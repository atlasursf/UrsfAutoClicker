name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: cmake-org/cmake-build-action@v1
        with:
          cmake-version: '3.28.x'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        shell: cmd
        run: cmake --build build --config Release

      - name: Deploy Qt
        shell: powershell
        run: |
          mkdir dist -ErrorAction SilentlyContinue
          Copy-Item build\Release\autoclicker.exe dist\UrsfAutoClicker.exe
          & "${{ env.Qt6_DIR }}\bin\windeployqt.exe" dist\UrsfAutoClicker.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrsfAutoClicker-Windows
          path: dist/
