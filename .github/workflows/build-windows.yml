name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtbase'

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt
        shell: powershell
        run: |
          mkdir dist
          Copy-Item build\Release\autoclicker-frontend.exe dist\UrsfAutoClicker.exe
          windeployqt dist\UrsfAutoClicker.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrsfAutoClicker-Windows
          path: dist/
